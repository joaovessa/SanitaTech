name: CI/CD SanitaTech

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # PRs antigos são cancelados; deploys na main sempre terminam.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilar módulos (build)
        run: python -m compileall -q app.py pipeline.py scripts tests

      - name: Rodar testes
        run: pytest -v

  deploy:
    name: Deploy no Azure App Service
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências no pacote
        # O App Service adiciona __oryx_packages__ ao PYTHONPATH na inicialização,
        # então o app sobe sem precisar compilar nada no servidor.
        run: pip install --no-compile --target __oryx_packages__ -r requirements.txt

      - name: Registrar a versão publicada
        run: |
          mkdir -p static
          printf '{"commit": "%s", "run": %s, "publicado_em": "%s"}\n' \
            "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > static/version.json
          cat static/version.json

      - name: Empacotar a aplicação
        run: zip -qr app.zip . -x '.git/*' '.github/*' 'tests/*' 'data/raw/*' 'data/status/*' 'data/logs/*'

      - name: Publicar no Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Validar a aplicação publicada
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          # O App Service pode levar alguns minutos para subir depois do build.
          curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors "$URL/_stcore/health"
          echo
          publicado=$(curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors "$URL/app/static/version.json")
          echo "Versão no ar: $publicado"
          echo "$publicado" | grep -q "\"${GITHUB_SHA::7}\"" || { echo "::error::A versão publicada não corresponde ao commit ${GITHUB_SHA::7}"; exit 1; }
          echo "### Deploy validado: $URL · commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
