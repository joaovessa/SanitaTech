[theme]
primaryColor = "#087f8c"
backgroundColor = "#f5f8fa"
secondaryBackgroundColor = "#e7eff3"
textColor = "#153243"
font = "sans serif"
[server]
address = "127.0.0.1"
headless = true
# Serve a pasta static/ em /app/static/. O deploy grava ali o version.json.
enableStaticServing = true
[browser]
gatherUsageStats = false
