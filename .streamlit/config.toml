# Identidade visual SanitaTech: petróleo (#0B4F5C), areia (#F5F2EB) e tinta (#0F2329).
[theme]
primaryColor = "#0B4F5C"
backgroundColor = "#F5F2EB"
secondaryBackgroundColor = "#EAE5D9"
textColor = "#0F2329"
font = "sans serif"
[server]
address = "127.0.0.1"
headless = true
# Serve a pasta static/ em /app/static/. O deploy grava ali o version.json.
enableStaticServing = true
[browser]
gatherUsageStats = false
[client]
# Esconde o menu de desenvolvedor (botão Deploy) para quem acessa o app publicado.
toolbarMode = "viewer"
